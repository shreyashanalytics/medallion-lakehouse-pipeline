version: 2

models:
  - name: silver_transactions
    description: Cleaned, deduplicated transactions (one row per transaction_id).
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: [completed, pending, cancelled, refunded]
      - name: net_amount
        description: Quantity x unit price after discount.

  - name: silver_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: silver_products
    columns:
      - name: product_id
        tests: [unique, not_null]
